<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none">
  <rect width="700" height="400" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Conditional Types — Flow Diagram</text>
  
  <!-- Input -->
  <rect x="270" y="70" width="160" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="101" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="monospace">T extends string?</text>
  
  <!-- Arrow down -->
  <line x1="350" y1="120" x2="350" y2="165" stroke="#475569" stroke-width="2"/>
  
  <!-- Diamond decision -->
  <polygon points="350,165 420,200 350,235 280,200" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Inter, sans-serif">?</text>
  
  <!-- Yes branch -->
  <line x1="280" y1="200" x2="200" y2="200" stroke="#22c55e" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="250" stroke="#22c55e" stroke-width="2"/>
  <polygon points="195,245 200,255 205,245" fill="#22c55e"/>
  <text x="240" y="195" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">Yes</text>
  
  <rect x="100" y="260" width="200" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="291" text-anchor="middle" fill="#86efac" font-size="16" font-weight="bold" font-family="monospace">true (string)</text>
  
  <!-- No branch -->
  <line x1="420" y1="200" x2="500" y2="200" stroke="#ef4444" stroke-width="2"/>
  <line x1="500" y1="200" x2="500" y2="250" stroke="#ef4444" stroke-width="2"/>
  <polygon points="495,245 500,255 505,245" fill="#ef4444"/>
  <text x="460" y="195" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">No</text>
  
  <rect x="400" y="260" width="200" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="291" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="bold" font-family="monospace">false (number)</text>
  
  <!-- Example -->
  <rect x="80" y="335" width="540" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="100" y="358" fill="#94a3b8" font-size="12" font-family="monospace">type IsString&lt;T&gt; = T extends string ? true : false;</text>
  <text x="100" y="373" fill="#64748b" font-size="11" font-family="Inter, sans-serif">type A = IsString&lt;"hello"&gt;;  // true</text>
</svg>
