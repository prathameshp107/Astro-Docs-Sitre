<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" fill="none">
  <rect width="700" height="350" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Union Types — Visual Merge Diagram</text>
  
  <!-- String box -->
  <rect x="80" y="90" width="180" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="170" y="126" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold" font-family="monospace">string</text>
  
  <!-- Number box -->
  <rect x="440" y="90" width="180" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="530" y="126" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold" font-family="monospace">number</text>
  
  <!-- Merge lines -->
  <line x1="260" y1="120" x2="320" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="120" x2="380" y2="175" stroke="#475569" stroke-width="2"/>
  
  <!-- Union result box -->
  <rect x="230" y="180" width="240" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="216" text-anchor="middle" fill="#86efac" font-size="16" font-weight="bold" font-family="monospace">string | number</text>
  
  <!-- Label -->
  <text x="350" y="270" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Inter, sans-serif">Value can be EITHER type</text>
  
  <!-- Example -->
  <rect x="150" y="285" width="400" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="350" y="310" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">let id: string | number = "abc";  // or 42</text>
</svg>
