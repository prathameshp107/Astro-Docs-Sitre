<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#020617"/>
  <text x="400" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">TypeScript Basic Types Overview</text>
  
  <!-- Primitives -->
  <text x="60" y="80" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="Inter, sans-serif">Primitive Types</text>
  <rect x="50" y="90" width="160" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="121" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="monospace">string</text>
  <rect x="230" y="90" width="160" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="310" y="121" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="monospace">number</text>
  <rect x="410" y="90" width="160" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="121" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="monospace">boolean</text>
  <rect x="590" y="90" width="160" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="670" y="121" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="monospace">bigint</text>

  <!-- Arrays & Tuples -->
  <text x="60" y="170" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="Inter, sans-serif">Arrays &amp; Tuples</text>
  <rect x="50" y="180" width="230" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="165" y="211" text-anchor="middle" fill="#86efac" font-size="13" font-family="monospace">number[] | Array&lt;T&gt;</text>
  <rect x="300" y="180" width="230" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="415" y="211" text-anchor="middle" fill="#86efac" font-size="13" font-family="monospace">[string, number]</text>
  <rect x="550" y="180" width="200" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="211" text-anchor="middle" fill="#86efac" font-size="13" font-family="monospace">readonly T[]</text>

  <!-- Special Types -->
  <text x="60" y="260" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="Inter, sans-serif">Special Types</text>
  <rect x="50" y="270" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="301" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">any</text>
  <rect x="190" y="270" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="301" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">unknown</text>
  <rect x="330" y="270" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="301" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">void</text>
  <rect x="470" y="270" width="120" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="301" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">never</text>
  <rect x="610" y="270" width="140" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="301" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="monospace">null | undefined</text>

  <!-- Usage examples -->
  <text x="60" y="350" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="Inter, sans-serif">Usage Examples</text>
  <rect x="50" y="360" width="700" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="70" y="385" fill="#94a3b8" font-size="12" font-family="monospace">let name: string = "Alice";</text>
  <text x="70" y="405" fill="#94a3b8" font-size="12" font-family="monospace">let age: number = 25;</text>
  <text x="70" y="425" fill="#94a3b8" font-size="12" font-family="monospace">let items: readonly string[] = ["a", "b"];</text>
  
  <text x="450" y="385" fill="#94a3b8" font-size="12" font-family="monospace">let tuple: [string, number] = ["age", 30];</text>
  <text x="450" y="405" fill="#94a3b8" font-size="12" font-family="monospace">let input: unknown = fetchData();</text>
  <text x="450" y="425" fill="#94a3b8" font-size="12" font-family="monospace">function log(): void { console.log(); }</text>
</svg>
