<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="12" fill="#020617"/>
  <text x="400" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Utility Types — Type Transformations</text>
  
  <!-- User type -->
  <rect x="300" y="70" width="200" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="101" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="monospace">interface User</text>
  
  <line x1="400" y1="120" x2="400" y2="145" stroke="#475569" stroke-width="2"/>
  <polygon points="395,140 400,150 405,140" fill="#475569"/>
  
  <!-- Transformations grid -->
  <rect x="40" y="155" width="160" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="186" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold" font-family="monospace">Partial&lt;User&gt;</text>
  <text x="120" y="205" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">All optional</text>
  
  <rect x="220" y="155" width="160" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="186" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold" font-family="monospace">Pick&lt;User,k&gt;</text>
  <text x="300" y="205" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">Select keys</text>
  
  <rect x="400" y="155" width="160" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="186" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold" font-family="monospace">Omit&lt;User,k&gt;</text>
  <text x="480" y="205" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">Remove keys</text>
  
  <rect x="580" y="155" width="180" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="670" y="186" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold" font-family="monospace">Readonly&lt;User&gt;</text>
  <text x="670" y="205" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">Immutable</text>
  
  <!-- More utilities row 2 -->
  <rect x="80" y="235" width="160" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="266" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold" font-family="monospace">Record&lt;K,V&gt;</text>
  <text x="160" y="285" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">Dict type</text>
  
  <rect x="260" y="235" width="160" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="266" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold" font-family="monospace">Required&lt;T&gt;</text>
  <text x="340" y="285" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">All required</text>
  
  <rect x="440" y="235" width="160" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold" font-family="monospace">ReturnType&lt;T&gt;</text>
  <text x="520" y="285" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">Fn return</text>
  
  <rect x="620" y="235" width="140" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="266" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold" font-family="monospace">NonNullable</text>
  <text x="690" y="285" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter, sans-serif">No null</text>
  
  <!-- Usage example -->
  <rect x="80" y="320" width="640" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="100" y="345" fill="#94a3b8" font-size="12" font-family="monospace">// Form state management</text>
  <text x="100" y="365" fill="#94a3b8" font-size="12" font-family="monospace">type FormErrors = Partial&lt;Record&lt;keyof FormState, string&gt;&gt;;</text>
  <text x="100" y="385" fill="#94a3b8" font-size="12" font-family="monospace">type PublicUser = Omit&lt;ApiUser, "password_hash"&gt;;</text>
</svg>
