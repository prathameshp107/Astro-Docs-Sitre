<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <rect width="800" height="350" rx="12" fill="#020617"/>
  <text x="400" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Advanced Generics — Type Transformation</text>
  
  <!-- Array<T> -->
  <rect x="80" y="90" width="180" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" fill="#f1f5f9" font-size="14" font-family="monospace">Generic: </text>
  <text x="170" y="133" text-anchor="middle" fill="#a5b4fc" font-size="18" font-weight="bold" font-family="monospace">Array&lt;T&gt;</text>
  
  <!-- Arrow 1 -->
  <line x1="260" y1="120" x2="330" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="325,115 335,120 325,125" fill="#475569"/>
  
  <!-- Constraint -->
  <rect x="310" y="80" width="180" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Inter, sans-serif">T extends User</text>
  <text x="400" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">Generic Constraint</text>
  <text x="400" y="144" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">Keyof, infer keywords</text>
  
  <!-- Arrow 2 -->
  <line x1="490" y1="120" x2="560" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="555,115 565,120 555,125" fill="#475569"/>
  
  <!-- Array<User> -->
  <rect x="560" y="90" width="180" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="116" text-anchor="middle" fill="#f1f5f9" font-size="14" font-family="monospace">Concrete: </text>
  <text x="650" y="133" text-anchor="middle" fill="#86efac" font-size="18" font-weight="bold" font-family="monospace">Array&lt;User&gt;</text>
  
  <!-- Arrow 3 down -->
  <line x1="650" y1="150" x2="650" y2="195" stroke="#475569" stroke-width="2"/>
  <polygon points="645,190 650,200 655,190" fill="#475569"/>
  
  <!-- User[] -->
  <rect x="560" y="200" width="180" height="50" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="231" text-anchor="middle" fill="#86efac" font-size="18" font-weight="bold" font-family="monospace">User[]</text>
  
  <!-- Inference example -->
  <rect x="80" y="200" width="200" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="180" y="225" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold" font-family="Inter, sans-serif">Type Inference</text>
  <text x="180" y="245" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">function identity&lt;T&gt;(arg: T): T</text>
  <text x="180" y="260" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">→ T captured at call site</text>
  
  <!-- Labels -->
  <text x="170" y="78" text-anchor="middle" fill="#6366f1" font-size="11" font-family="Inter, sans-serif">Step 1: Declaration</text>
  <text x="400" y="70" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="Inter, sans-serif">Step 2: Constrain</text>
  <text x="650" y="78" text-anchor="middle" fill="#22c55e" font-size="11" font-family="Inter, sans-serif">Step 3: Usage</text>
</svg>
