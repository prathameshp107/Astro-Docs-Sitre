<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" fill="none">
  <rect width="700" height="380" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">React + TypeScript Flow</text>
  
  <!-- Props -->
  <rect x="260" y="70" width="180" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="101" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="monospace">Props</text>
  
  <!-- Arrow -->
  <line x1="350" y1="120" x2="350" y2="155" stroke="#475569" stroke-width="2"/>
  <polygon points="345,150 350,160 355,150" fill="#475569"/>
  
  <!-- Interface -->
  <rect x="245" y="160" width="210" height="50" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="191" text-anchor="middle" fill="#86efac" font-size="15" font-weight="bold" font-family="monospace">interface</text>
  
  <!-- Arrow -->
  <line x1="350" y1="210" x2="350" y2="245" stroke="#475569" stroke-width="2"/>
  <polygon points="345,240 350,250 355,240" fill="#475569"/>
  
  <!-- Component -->
  <rect x="245" y="250" width="210" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="281" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold" font-family="monospace">Component</text>
  
  <!-- Arrow -->
  <line x1="350" y1="300" x2="350" y2="335" stroke="#475569" stroke-width="2"/>
  <polygon points="345,330 350,340 355,330" fill="#475569"/>
  
  <!-- Type Safety -->
  <rect x="245" y="340" width="210" height="30" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="360" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold" font-family="Inter, sans-serif">Type Safety ✅</text>
</svg>
