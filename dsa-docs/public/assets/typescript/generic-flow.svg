<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" fill="none">
  <rect width="700" height="320" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Generic Flow Diagram</text>
  
  <!-- Input -->
  <rect x="80" y="80" width="160" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="116" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold" font-family="monospace">Input&lt;T&gt;</text>
  
  <!-- Arrow -->
  <line x1="240" y1="110" x2="310" y2="110" stroke="#475569" stroke-width="2"/>
  <polygon points="305,105 315,110 305,115" fill="#475569"/>
  
  <!-- Processing -->
  <rect x="310" y="80" width="160" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="116" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold" font-family="monospace">Processing</text>
  
  <!-- Arrow -->
  <line x1="470" y1="110" x2="540" y2="110" stroke="#475569" stroke-width="2"/>
  <polygon points="535,105 545,110 535,115" fill="#475569"/>
  
  <!-- Output -->
  <rect x="540" y="80" width="140" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="610" y="116" text-anchor="middle" fill="#86efac" font-size="16" font-weight="bold" font-family="monospace">Output&lt;T&gt;</text>
  
  <!-- Example usage -->
  <rect x="80" y="180" width="580" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="100" y="210" fill="#94a3b8" font-size="13" font-family="monospace">function identity&lt;T&gt;(arg: T): T {</text>
  <text x="100" y="232" fill="#94a3b8" font-size="13" font-family="monospace">  return arg;</text>
  <text x="100" y="254" fill="#94a3b8" font-size="13" font-family="monospace">}</text>
  <text x="100" y="270" fill="#64748b" font-size="11" font-family="Inter, sans-serif">T is captured at call site — maintains type safety</text>
</svg>
