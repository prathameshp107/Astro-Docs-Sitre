<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" fill="none">
  <rect width="700" height="350" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Mapped Types — Property Transform</text>
  
  <!-- Input type -->
  <rect x="230" y="70" width="240" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold" font-family="monospace">interface User</text>
  <text x="350" y="115" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">{ name: string; age: number }</text>
  
  <!-- Arrow -->
  <line x1="350" y1="130" x2="350" y2="165" stroke="#475569" stroke-width="2"/>
  <polygon points="345,160 350,170 355,160" fill="#475569"/>
  
  <!-- Transform box -->
  <rect x="200" y="170" width="300" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="201" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="monospace">[K in keyof T]: Transform&lt;T[K]&gt;</text>
  
  <!-- Arrow -->
  <line x1="350" y1="220" x2="350" y2="255" stroke="#475569" stroke-width="2"/>
  <polygon points="345,250 350,260 355,250" fill="#475569"/>
  
  <!-- Output type -->
  <rect x="200" y="260" width="300" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="285" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold" font-family="monospace">Readonly&lt;User&gt;</text>
  <text x="350" y="305" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">{ readonly name: string; readonly age: number }</text>
</svg>
