  <rect x="230" y="220" width="240" height="45" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="248" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold" font-family="monospace">Interface / Model</text>
  
  <!-- Arrow -->
  <line x1="350" y1="265" x2="350" y2="290" stroke="#475569" stroke-width="2"/>
