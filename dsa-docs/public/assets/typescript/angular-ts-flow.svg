<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" fill="none">
  <rect width="700" height="380" rx="12" fill="#020617"/>
  <text x="350" y="40" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold" font-family="Inter, sans-serif">Angular + TypeScript Flow</text>
  
  <!-- Component -->
  <rect x="250" y="70" width="200" height="45" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="98" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="monospace">Component</text>
  
  <!-- Arrow -->
  <line x1="350" y1="115" x2="350" y2="140" stroke="#475569" stroke-width="2"/>
  <polygon points="345,135 350,145 355,135" fill="#475569"/>
  
  <!-- Service -->
  <rect x="250" y="145" width="200" height="45" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="173" text-anchor="middle" fill="#86efac" font-size="15" font-weight="bold" font-family="monospace">Service (DI)</text>
  
  <!-- Arrow -->
  <line x1="350" y1="190" x2="350" y2="215" stroke="#475569" stroke-width="2"/>
  <polygon points="345,210 350,220 355,210" fill="#475569"/>
  
