<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="framePush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="frameActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="frameReturned" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ecf0f1" font-size="22" font-weight="bold" font-family="Arial">Call Stack: Winding &amp; Unwinding Phases</text>
  <text x="400" y="62" text-anchor="middle" fill="#bdc3c7" font-size="13" font-family="Arial">factorial(4) — Stack Frames Visualization</text>

  <!-- Left side: Winding Phase -->
  <text x="160" y="90" text-anchor="middle" fill="#3498db" font-size="16" font-weight="bold" font-family="Arial">⬇ WINDING (Calling)</text>

  <!-- Stack representation - left stack (winding) -->
  <!-- Stack container -->
  <rect x="70" y="100" width="180" height="340" rx="6" fill="none" stroke="#34495e" stroke-width="2"/>
  <text x="160" y="460" text-anchor="middle" fill="#7f8c8d" font-size="12" font-family="Arial">BOTTOM (First In)</text>

  <!-- Stack frame 4 - bottom -->
  <rect x="82" y="100" width="156" height="55" rx="4" fill="url(#framePush)" filter="url(#shadow)"/>
  <text x="160" y="122" text-anchor="middle" fill="#ecf0f1" font-size="13" font-weight="bold">factorial(4)</text>
  <text x="160" y="140" text-anchor="middle" fill="#bdc3c7" font-size="11">n = 4 | waiting...</text>

  <!-- Stack frame 3 -->
  <rect x="82" y="162" width="156" height="55" rx="4" fill="url(#framePush)" filter="url(#shadow)"/>
  <text x="160" y="184" text-anchor="middle" fill="#ecf0f1" font-size="13" font-weight="bold">factorial(3)</text>
  <text x="160" y="202" text-anchor="middle" fill="#bdc3c7" font-size="11">n = 3 | waiting...</text>

  <!-- Stack frame 2 -->
  <rect x="82" y="224" width="156" height="55" rx="4" fill="url(#framePush)" filter="url(#shadow)"/>
  <text x="160" y="246" text-anchor="middle" fill="#ecf0f1" font-size="13" font-weight="bold">factorial(2)</text>
  <text x="160" y="264" text-anchor="middle" fill="#bdc3c7" font-size="11">n = 2 | waiting...</text>

  <!-- Stack frame 1 - active (top) -->
  <rect x="82" y="286" width="156" height="55" rx="4" fill="url(#frameActive)" filter="url(#shadow)"/>
  <text x="160" y="308" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">factorial(1) ⬅ ACTIVE</text>
  <text x="160" y="326" text-anchor="middle" fill="#f5b7b1" font-size="11">n = 1 | BASE CASE → returns 1</text>

  <polygon points="160,360 148,348 172,348" fill="#e74c3c"/>

  <!-- Arrow winding -->
  <text x="160" y="380" text-anchor="middle" fill="#3498db" font-size="12" font-family="Arial">TOP (Last In)</text>

  <!-- Right side: Unwinding Phase -->
  <text x="620" y="90" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="bold" font-family="Arial">⬆ UNWINDING (Returning)</text>

  <!-- Stack container - right -->
  <rect x="530" y="100" width="180" height="340" rx="6" fill="none" stroke="#34495e" stroke-width="2"/>

  <!-- Unwinding frames (reversed order - popping from top) -->
  <rect x="542" y="286" width="156" height="55" rx="4" fill="url(#frameReturned)" filter="url(#shadow)"/>
  <text x="620" y="308" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">factorial(1)</text>
  <text x="620" y="326" text-anchor="middle" fill="#a9dfbf" font-size="11">✅ returns 1 → popped!</text>

  <rect x="542" y="224" width="156" height="55" rx="4" fill="url(#frameReturned)" filter="url(#shadow)"/>
  <text x="620" y="246" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">factorial(2)</text>
  <text x="620" y="264" text-anchor="middle" fill="#a9dfbf" font-size="11">✅ 2 × 1 = 2 → popped!</text>

  <rect x="542" y="162" width="156" height="55" rx="4" fill="url(#frameReturned)" filter="url(#shadow)"/>
  <text x="620" y="184" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">factorial(3)</text>
  <text x="620" y="202" text-anchor="middle" fill="#a9dfbf" font-size="11">✅ 3 × 2 = 6 → popped!</text>

  <rect x="542" y="100" width="156" height="55" rx="4" fill="url(#frameReturned)" filter="url(#shadow)"/>
  <text x="620" y="122" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">factorial(4)</text>
  <text x="620" y="140" text-anchor="middle" fill="#a9dfbf" font-size="11">✅ 4 × 6 = 24 → DONE!</text>

  <polygon points="620,94 608,106 632,106" fill="#27ae60"/>

  <!-- Center arrow connecting both phases -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
  </defs>

  <!-- Process flow -->
  <text x="400" y="510" text-anchor="middle" fill="#ecf0f1" font-size="14" font-family="Arial">⏳ Result: factorial(4) = <tspan fill="#f1c40f" font-weight="bold">24</tspan></text>
  <text x="400" y="535" text-anchor="middle" fill="#7f8c8d" font-size="12" font-family="Arial">Stack Depth: O(n) | Max frames on stack at once: 4</text>

  <!-- Legend -->
  <rect x="260" y="555" width="14" height="14" rx="2" fill="#0f3460"/>
  <text x="280" y="567" fill="#bdc3c7" font-size="11" font-family="Arial">Waiting</text>
  <rect x="340" y="555" width="14" height="14" rx="2" fill="#e74c3c"/>
  <text x="360" y="567" fill="#bdc3c7" font-size="11" font-family="Arial">Active</text>
  <rect x="415" y="555" width="14" height="14" rx="2" fill="#27ae60"/>
  <text x="435" y="567" fill="#bdc3c7" font-size="11" font-family="Arial">Returned</text>
</svg>