<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="foundGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="elimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#636e72"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#dfe6e9" font-size="20" font-weight="bold">Binary Search — Search for target = 35</text>
  <text x="450" y="55" text-anchor="middle" fill="#b2bec3" font-size="13">Array: [5, 10, 15, 20, 25, 30, 35, 40, 45]</text>

  <!-- Step 1 -->
  <text x="40" y="90" fill="#74b9ff" font-size="14" font-weight="bold">Step 1</text>
  <text x="40" y="108" fill="#b2bec3" font-size="11">lo=0, hi=8 → mid=4 → arr[4]=25</text>
  <text x="40" y="122" fill="#b2bec3" font-size="11">25 &lt; 35 → search RIGHT half</text>

  <!-- Array elements row 1 -->
  <g transform="translate(40, 135)">
    <rect x="0" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="70" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="140" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="210" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="280" y="0" width="64" height="40" rx="4" fill="url(#midGrad)" filter="url(#glow)"/>
    <rect x="350" y="0" width="64" height="40" rx="4" fill="#0984e3"/>
    <rect x="420" y="0" width="64" height="40" rx="4" fill="#0984e3"/>
    <rect x="490" y="0" width="64" height="40" rx="4" fill="#0984e3"/>
    <rect x="560" y="0" width="64" height="40" rx="4" fill="#0984e3"/>

    <text x="32" y="26" text-anchor="middle" fill="#636e72" font-size="13">5</text>
    <text x="102" y="26" text-anchor="middle" fill="#636e72" font-size="13">10</text>
    <text x="172" y="26" text-anchor="middle" fill="#636e72" font-size="13">15</text>
    <text x="242" y="26" text-anchor="middle" fill="#636e72" font-size="13">20</text>
    <text x="312" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13" font-weight="bold">25</text>
    <text x="382" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">30</text>
    <text x="452" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">35</text>
    <text x="522" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">40</text>
    <text x="592" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">45</text>
  </g>

  <!-- Labels row 1 -->
  <g transform="translate(40, 175)">
    <text x="0" y="0" fill="#636e72" font-size="10">lo</text>
    <text x="604" y="0" fill="#636e72" font-size="10">hi</text>
    <text x="312" y="0" text-anchor="middle" fill="#a29bfe" font-size="10" font-weight="bold">mid</text>
  </g>

  <!-- Step 2 -->
  <text x="40" y="220" fill="#74b9ff" font-size="14" font-weight="bold">Step 2</text>
  <text x="40" y="238" fill="#b2bec3" font-size="11">lo=5, hi=8 → mid=6 → arr[6]=35</text>
  <text x="40" y="252" fill="#00b894" font-size="11">35 === 35 → FOUND at index 6! ✓</text>

  <!-- Array elements row 2 -->
  <g transform="translate(40, 265)">
    <rect x="0" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="70" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="140" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="210" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="280" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="350" y="0" width="64" height="40" rx="4" fill="url(#elimGrad)" opacity="0.7"/>
    <rect x="420" y="0" width="64" height="44" rx="6" fill="url(#foundGlow)" filter="url(#glow)"/>
    <rect x="490" y="0" width="64" height="40" rx="4" fill="#0984e3"/>
    <rect x="560" y="0" width="64" height="40" rx="4" fill="#0984e3"/>

    <text x="32" y="26" text-anchor="middle" fill="#636e72" font-size="13">5</text>
    <text x="102" y="26" text-anchor="middle" fill="#636e72" font-size="13">10</text>
    <text x="172" y="26" text-anchor="middle" fill="#636e72" font-size="13">15</text>
    <text x="242" y="26" text-anchor="middle" fill="#636e72" font-size="13">20</text>
    <text x="312" y="26" text-anchor="middle" fill="#636e72" font-size="13">25</text>
    <text x="382" y="26" text-anchor="middle" fill="#636e72" font-size="13">30</text>
    <text x="452" y="30" text-anchor="middle" fill="#1a1a2e" font-size="15" font-weight="bold">35</text>
    <text x="522" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">40</text>
    <text x="592" y="26" text-anchor="middle" fill="#dfe6e9" font-size="13">45</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#elimGrad)" opacity="0.7"/>
    <text x="22" y="13" fill="#636e72" font-size="11">Eliminated</text>

    <rect x="100" y="0" width="16" height="16" rx="3" fill="#0984e3"/>
    <text x="122" y="13" fill="#636e72" font-size="11">Search range</text>

    <rect x="210" y="0" width="16" height="16" rx="3" fill="url(#midGrad)"/>
    <text x="232" y="13" fill="#a29bfe" font-size="11">Midpoint</text>

    <rect x="300" y="0" width="16" height="16" rx="3" fill="url(#foundGlow)"/>
    <text x="322" y="13" fill="#00b894" font-size="11">Found!</text>
  </g>

  <!-- Complexity box -->
  <rect x="40" y="375" width="820" height="70" rx="8" fill="#2d3436" opacity="0.8"/>
  <text x="60" y="398" fill="#dfe6e9" font-size="14" font-weight="bold">⏱ Complexity</text>
  <text x="60" y="420" fill="#b2bec3" font-size="12">Time: O(log n) — halves the search space each iteration</text>
  <text x="60" y="438" fill="#b2bec3" font-size="12">Space: O(1) — iterative uses constant extra space (recursive O(log n) stack)</text>

  <!-- Quick facts -->
  <rect x="40" y="460" width="820" height="85" rx="8" fill="#2d3436" opacity="0.8"/>
  <text x="60" y="483" fill="#dfe6e9" font-size="14" font-weight="bold">💡 Quick Facts</text>
  <text x="60" y="505" fill="#b2bec3" font-size="12">• Array must be sorted or monotonic</text>
  <text x="60" y="523" fill="#b2bec3" font-size="12">• In 1M elements: 20 comparisons max (vs. 1M for linear search)</text>
  <text x="60" y="541" fill="#b2bec3" font-size="12">• Safe midpoint: lo + (hi - lo) / 2 (avoids integer overflow)</text>
</svg>