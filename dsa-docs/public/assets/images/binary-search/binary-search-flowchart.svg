<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="580" fill="url(#bgGrad3)" rx="12"/>

  <text x="400" y="32" text-anchor="middle" fill="#dfe6e9" font-size="18" font-weight="bold">🧭 Binary Search — Which Pattern to Use?</text>

  <!-- Start -->
  <rect x="300" y="55" width="200" height="36" rx="18" fill="#6c5ce7" filter="url(#shadow3)"/>
  <text x="400" y="78" text-anchor="middle" fill="#dfe6e9" font-size="13" font-weight="bold">Start: Sorted/Monotonic?</text>

  <!-- Arrow down -->
  <line x1="400" y1="91" x2="400" y2="115" stroke="#636e72" stroke-width="2"/>
  <polygon points="395,112 400,122 405,112" fill="#636e72"/>

  <!-- Diamond - What kind of search? -->
  <rect x="240" y="120" width="320" height="36" rx="8" fill="#0984e3" filter="url(#shadow3)"/>
  <text x="400" y="143" text-anchor="middle" fill="#dfe6e9" font-size="12">What are you looking for?</text>

  <!-- 3 branches -->
  <line x1="400" y1="156" x2="400" y2="175" stroke="#636e72" stroke-width="2"/>
  <polygon points="395,172 400,182 405,172" fill="#636e72"/>

  <line x1="400" y1="175" x2="130" y2="210" stroke="#636e72" stroke-width="1.5"/>
  <line x1="400" y1="175" x2="400" y2="210" stroke="#636e72" stroke-width="1.5"/>
  <line x1="400" y1="175" x2="670" y2="210" stroke="#636e72" stroke-width="1.5"/>
  <polygon points="125,207 130,218 135,207" fill="#636e72"/>
  <polygon points="395,207 400,218 405,207" fill="#636e72"/>
  <polygon points="665,207 670,218 675,207" fill="#636e72"/>

  <!-- Branch 1: Exact value -->
  <rect x="40" y="220" width="180" height="36" rx="8" fill="#00b894" filter="url(#shadow3)"/>
  <text x="130" y="243" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">Exact value?</text>

  <rect x="40" y="270" width="180" height="50" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="130" y="290" text-anchor="middle" fill="#dfe6e9" font-size="11">Pattern 1: Classic</text>
  <text x="130" y="307" text-anchor="middle" fill="#b2bec3" font-size="10">while (lo &lt;= hi)</text>

  <rect x="40" y="335" width="180" height="50" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="130" y="355" text-anchor="middle" fill="#dfe6e9" font-size="11">Pattern 2: First/Last</text>
  <text x="130" y="372" text-anchor="middle" fill="#b2bec3" font-size="10">Duplicates? Use boundary search</text>

  <!-- Branch 2: Min/Max feasible -->
  <rect x="310" y="220" width="180" height="36" rx="8" fill="#e17055" filter="url(#shadow3)"/>
  <text x="400" y="238" text-anchor="middle" fill="#dfe6e9" font-size="11" font-weight="bold">Min/Max feasible?</text>
  <text x="400" y="252" text-anchor="middle" fill="#b2bec3" font-size="10">(Answer space search)</text>

  <rect x="310" y="280" width="180" height="36" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="400" y="303" text-anchor="middle" fill="#dfe6e9" font-size="11">Pattern 3: Answer Space</text>

  <rect x="310" y="330" width="180" height="60" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="400" y="350" text-anchor="middle" fill="#b2bec3" font-size="10">Koko Bananas</text>
  <text x="400" y="365" text-anchor="middle" fill="#b2bec3" font-size="10">Ship Packages</text>
  <text x="400" y="380" text-anchor="middle" fill="#b2bec3" font-size="10">Split Array</text>

  <!-- Branch 3: Other -->
  <rect x="580" y="220" width="180" height="36" rx="8" fill="#a29bfe" filter="url(#shadow3)"/>
  <text x="670" y="243" text-anchor="middle" fill="#1a1a2e" font-size="11" font-weight="bold">Other conditions?</text>

  <rect x="580" y="270" width="180" height="50" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="670" y="290" text-anchor="middle" fill="#dfe6e9" font-size="11">Pattern 4: Rotated?</text>
  <text x="670" y="307" text-anchor="middle" fill="#b2bec3" font-size="10">Which half is sorted?</text>

  <rect x="580" y="335" width="180" height="50" rx="8" fill="#2d3436" opacity="0.9"/>
  <text x="670" y="355" text-anchor="middle" fill="#dfe6e9" font-size="11">Pattern 5: Monotonic?</text>
  <text x="670" y="372" text-anchor="middle" fill="#b2bec3" font-size="10">f(x) crosses threshold</text>

  <!-- Summary box at bottom -->
  <rect x="40" y="410" width="720" height="150" rx="10" fill="#2d3436" opacity="0.8"/>
  <text x="60" y="435" fill="#74b9ff" font-size="14" font-weight="bold">📝 Pattern Cheat Sheet</text>

  <g transform="translate(60, 450)">
    <text x="0" y="15" fill="#dfe6e9" font-size="11">Pattern 1 — Classic: lo &lt;= hi, lo=mid+1, hi=mid-1</text>
    <text x="0" y="35" fill="#dfe6e9" font-size="11">Pattern 2 — First/Last: lo &lt;= hi, record on match, keep shrinking</text>
    <text x="0" y="55" fill="#dfe6e9" font-size="11">Pattern 3 — Answer: lo &lt;= hi, condition(mid) → hi=mid-1 else lo=mid+1</text>
    <text x="0" y="75" fill="#dfe6e9" font-size="11">Pattern 4 — Rotated: lo &lt;= hi, check sorted half, eliminate the other</text>
    <text x="0" y="95" fill="#dfe6e9" font-size="11">Pattern 5 — Boundary: lo &lt; hi, condition(mid) → hi=mid else lo=mid+1</text>
  </g>
</svg>