<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowC" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/></marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Cycle Detection</text>

  <!-- LEFT: Undirected cycle -->
  <rect x="20" y="45" width="370" height="360" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="205" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Cycle in Undirected Graph</text>
  <text x="205" y="85" text-anchor="middle" font-size="10" fill="#64748b">DFS with parent tracking</text>

  <circle cx="150" cy="130" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="150" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">A</text>
  <circle cx="290" cy="130" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="290" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">B</text>
  <circle cx="120" cy="250" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">D</text>
  <circle cx="280" cy="260" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="280" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">C</text>

  <line x1="172" y1="128" x2="268" y2="128" stroke="#dc2626" stroke-width="2"/>
  <line x1="148" y1="152" x2="126" y2="228" stroke="#dc2626" stroke-width="2"/>
  <line x1="285" y1="152" x2="275" y2="238" stroke="#dc2626" stroke-width="2"/>
  <line x1="140" y1="236" x2="262" y2="250" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,3"/>

  <text x="195" y="195" font-size="11" fill="#dc2626" text-anchor="middle">A→B→C→D→A</text>
  <text x="195" y="210" font-size="11" fill="#dc2626" font-weight="bold" text-anchor="middle">⚠ Cycle detected!</text>

  <rect x="30" y="300" width="350" height="90" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="205" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Detection: DFS + Parent</text>
  <text x="45" y="340" font-size="10" fill="#475569">If we visit a neighbor that is already visited</text>
  <text x="45" y="356" font-size="10" fill="#475569">AND it is NOT the parent → there's a cycle!</text>
  <text x="45" y="375" font-size="10" fill="#64748b">DFS(A): A→B→C→D. D's neighbor A (visited, not parent) → Cycle</text>

  <!-- RIGHT: Directed cycle -->
  <rect x="410" y="45" width="370" height="360" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="595" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Cycle in Directed Graph</text>
  <text x="595" y="85" text-anchor="middle" font-size="10" fill="#64748b">DFS with recursion stack</text>

  <circle cx="530" cy="130" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="530" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">0</text>
  <circle cx="670" cy="130" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="670" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">1</text>
  <circle cx="500" cy="260" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="500" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">3</text>
  <circle cx="660" cy="260" r="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="660" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2</text>

  <line x1="552" y1="130" x2="648" y2="130" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="648" y1="145" x2="530" y2="245" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="532" y1="152" x2="502" y2="238" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="660" y1="145" x2="660" y2="238" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- Highlight the cycle -->
  <path d="M552,130 L670,130 L648,145 L530,245 L502,238 L532,152 Z" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="5,3"/>

  <text x="595" y="195" font-size="11" fill="#dc2626" text-anchor="middle">0→1→2→3→0</text>
  <text x="595" y="210" font-size="11" fill="#dc2626" font-weight="bold" text-anchor="middle">⚠ Back edge: 3→0 (0 in recStack)</text>

  <rect x="420" y="300" width="350" height="90" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="595" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Detection: DFS + recStack</text>
  <text x="435" y="340" font-size="10" fill="#475569">Track two sets: visited (all) + recStack (current path)</text>
  <text x="435" y="356" font-size="10" fill="#475569">If neighbor is in recStack → back edge → cycle!</text>
  <text x="435" y="375" font-size="10" fill="#64748b">DFS(0)→DFS(1)→DFS(2)→DFS(3). 0 is in recStack → Cycle!</text>

  <!-- DAG example (bottom) -->
  <rect x="20" y="15" width="0" height="0"/>
</svg>
