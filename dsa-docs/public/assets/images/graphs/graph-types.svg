<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowDir" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arrowDirOk" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Types of Graphs — Visual Comparison</text>

  <!-- SECTION 1: Directed vs Undirected (left half) -->
  <rect x="30" y="50" width="360" height="210" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="210" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Undirected Graph</text>
  <text x="210" y="93" text-anchor="middle" font-size="11" fill="#64748b">Edges have no direction</text>

  <!-- Undirected graph nodes -->
  <circle cx="120" cy="130" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <circle cx="290" cy="120" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <circle cx="100" cy="220" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">C</text>
  <circle cx="280" cy="230" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">D</text>

  <!-- Undirected edges -->
  <line x1="136" y1="130" x2="272" y2="120" stroke="#2563eb" stroke-width="2"/>
  <line x1="118" y1="146" x2="100" y2="202" stroke="#2563eb" stroke-width="2"/>
  <line x1="272" y1="134" x2="100" y2="204" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="238" x2="262" y2="230" stroke="#2563eb" stroke-width="2"/>

  <!-- SECTION 2: Directed (right half) -->
  <rect x="410" y="50" width="360" height="210" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="590" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Directed Graph (Digraph)</text>
  <text x="590" y="93" text-anchor="middle" font-size="11" fill="#64748b">Edges have direction (arrows)</text>

  <!-- Directed graph nodes -->
  <circle cx="500" cy="130" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">A</text>
  <circle cx="670" cy="120" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">B</text>
  <circle cx="480" cy="220" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">C</text>
  <circle cx="660" cy="230" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">D</text>

  <!-- Directed edges -->
  <line x1="518" y1="130" x2="652" y2="120" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowDirOk)"/>
  <line x1="500" y1="148" x2="484" y2="202" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowDirOk)"/>
  <line x1="654" y1="134" x2="488" y2="204" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowDirOk)"/>
  <line x1="498" y1="238" x2="642" y2="230" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowDirOk)"/>

  <!-- SECTION 3: Unweighted (left half, bottom) -->
  <rect x="30" y="280" width="360" height="210" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="210" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Unweighted Graph</text>
  <text x="210" y="323" text-anchor="middle" font-size="11" fill="#64748b">All edges have equal cost</text>

  <circle cx="120" cy="360" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">X</text>
  <circle cx="290" cy="350" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Y</text>
  <circle cx="100" cy="450" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="100" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Z</text>

  <!-- Unweighted edges -->
  <line x1="136" y1="355" x2="274" y2="350" stroke="#dc2626" stroke-width="2"/>
  <line x1="128" y1="376" x2="102" y2="432" stroke="#dc2626" stroke-width="2"/>
  <line x1="276" y1="358" x2="108" y2="436" stroke="#dc2626" stroke-width="2"/>

  <!-- SECTION 4: Weighted (right half, bottom) -->
  <rect x="410" y="280" width="360" height="210" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="590" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Weighted Graph</text>
  <text x="590" y="323" text-anchor="middle" font-size="11" fill="#64748b">Each edge has a numeric cost/weight</text>

  <circle cx="500" cy="360" r="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">X</text>
  <circle cx="670" cy="350" r="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="670" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Y</text>
  <circle cx="480" cy="450" r="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Z</text>

  <!-- Weighted edges with labels -->
  <line x1="518" y1="355" x2="652" y2="350" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="340" text-anchor="middle" font-size="11" fill="#ea580c" font-weight="bold">5</text>
  <line x1="500" y1="378" x2="485" y2="432" stroke="#ea580c" stroke-width="2"/>
  <text x="470" y="405" text-anchor="middle" font-size="11" fill="#ea580c" font-weight="bold">8</text>
  <line x1="654" y1="364" x2="500" y2="436" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="410" text-anchor="middle" font-size="11" fill="#ea580c" font-weight="bold">3</text>

  <!-- Legend -->
  <rect x="30" y="10" width="0" height="0" fill="none"/>
</svg>
