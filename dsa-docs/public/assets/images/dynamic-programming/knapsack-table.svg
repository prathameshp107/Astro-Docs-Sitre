  <text x="460" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Answer: 10 ✅</text>

  <!-- Explanation panel -->
  <rect x="50" y="285" width="700" height="80" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="307" font-size="12" font-weight="bold" fill="#1e293b">How the Recurrence Works</text>
  <text x="60" y="327" font-size="11" fill="#475569">dp[i][w] = Math.max( dp[i-1][w],  dp[i-1][w - wt[i-1]] + val[i-1] )</text>
  <text x="60" y="347" font-size="10" fill="#64748b">                  ↑ Skip item i        ↑ Take item i if it fits (add its value)</text>
  <text x="60" y="362" font-size="10" fill="#64748b">Example: dp[4][8] = max(dp[3][8]=9, dp[3][8-5] + 6 = dp[3][3] + 6 = 4 + 6 = 10) → 10</text>

  <!-- Arrow annotations -->
  <rect x="510" y="295" width="230" height="65" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="625" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Optimal Selection</text>
  <text x="520" y="328" font-size="10" fill="#475569">Items 2 (wt=3,v=4) + 4 (wt=5,v=6)</text>
  <text x="520" y="344" font-size="10" fill="#475569">Total weight: 8, Total value: 10</text>

  <!-- Legend -->
  <rect x="50" y="380" width="700" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#94a3b8">Key Properties</text>
  <text x="400" y="418" text-anchor="middle" font-size="10" fill="#94a3b8">Time: O(n × W)  |  Space: O(n × W) → O(W) with 1D optimization  |  Pseudo-polynomial (depends on W)</text>

  <!-- Orange cells explanation -->
  <text x="400" y="448" text-anchor="middle" font-size="10" fill="#64748b">🧡 Orange cells = decision path (which items were taken to reach the optimal value)</text>
  <text x="400" y="462" text-anchor="middle" font-size="10" fill="#64748b">💚 Green cell = final answer dp[4][8] = 10</text>

  <!-- Footer -->
  <rect x="50" y="480" width="700" height="28" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="400" y="499" text-anchor="middle" font-size="10" fill="#c2410c">💡 Tip: Iterate W backwards for 1D optimization to avoid reusing the same item twice</text>
