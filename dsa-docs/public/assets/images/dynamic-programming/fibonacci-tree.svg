<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <linearGradient id="nodeNormal" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1d4ed8"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
    <linearGradient id="nodeCached" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
    <linearGradient id="nodeLeaf" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#c2410c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
    <linearGradient id="nodeCrossed" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#64748b"/><stop offset="100%" style="stop-color:#94a3b8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#bgGrad)" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Fibonacci — Overlapping Subproblems with Memoization</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#64748b">Green nodes are computed only once and cached — subsequent calls hit the cache instantly</text>

  <!-- Tree Level 0: fib(6) -->
  <ellipse cx="400" cy="85" rx="35" ry="18" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(6)</text>

  <!-- Tree Level 1 -->
  <line x1="375" y1="102" x2="280" y2="132" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="425" y1="102" x2="520" y2="132" stroke="#94a3b8" stroke-width="1.5"/>

  <ellipse cx="275" cy="140" rx="35" ry="18" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="275" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(5)</text>

  <ellipse cx="520" cy="140" rx="35" ry="18" fill="url(#nodeCached)" filter="url(#shadow)" stroke="#22c55e" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(4)</text>
  <text x="520" y="165" text-anchor="middle" font-size="9" fill="#16a34a">→ CACHED ✓</text>

  <!-- Tree Level 2 -->
  <line x1="250" y1="157" x2="160" y2="187" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="157" x2="350" y2="187" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="495" y1="157" x2="440" y2="187" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="545" y1="157" x2="610" y2="187" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <ellipse cx="155" cy="195" rx="35" ry="18" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="155" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(4)</text>

  <ellipse cx="350" cy="195" rx="35" ry="18" fill="url(#nodeCached)" filter="url(#shadow)" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(3)</text>
  <text x="350" y="218" text-anchor="middle" font-size="9" fill="#16a34a">CACHED ✓</text>

  <ellipse cx="435" cy="195" rx="35" ry="18" fill="url(#nodeCrossed)" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="435" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SKIP</text>

  <ellipse cx="615" cy="195" rx="35" ry="18" fill="url(#nodeCrossed)" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="615" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SKIP</text>

  <!-- Tree Level 3 -->
  <line x1="125" y1="212" x2="55" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="185" y1="212" x2="230" y2="242" stroke="#94a3b8" stroke-width="1.5"/>

  <ellipse cx="50" cy="250" rx="35" ry="18" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="50" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(3)</text>

  <ellipse cx="230" cy="250" rx="35" ry="18" fill="url(#nodeCached)" filter="url(#shadow)" stroke="#22c55e" stroke-width="2"/>
  <text x="230" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(2)</text>
  <text x="230" y="273" text-anchor="middle" font-size="9" fill="#16a34a">CACHED ✓</text>

  <!-- Tree Level 4 -->
  <line x1="25" y1="267" x2="20" y2="297" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="267" x2="120" y2="297" stroke="#94a3b8" stroke-width="1.5"/>

  <ellipse cx="25" cy="305" rx="35" ry="18" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="25" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(2)</text>

  <ellipse cx="120" cy="305" rx="35" ry="18" fill="url(#nodeLeaf)" filter="url(#shadow)"/>
  <text x="120" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(1)</text>

  <!-- Tree Level 5 -->
  <line x1="5" y1="322" x2="10" y2="352" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="45" y1="322" x2="70" y2="352" stroke="#94a3b8" stroke-width="1.5"/>

  <ellipse cx="10" cy="360" rx="35" ry="18" fill="url(#nodeLeaf)" filter="url(#shadow)"/>
  <text x="10" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(1)</text>
  <ellipse cx="70" cy="360" rx="35" ry="18" fill="url(#nodeLeaf)" filter="url(#shadow)"/>
  <text x="70" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">fib(0)</text>

  <!-- Stats Panel -->
  <rect x="420" y="260" width="350" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Before/After Memoization</text>

  <text x="435" y="305" font-size="11" fill="#64748b">Without memoization:</text>
  <text x="435" y="322" font-size="11" font-weight="bold" fill="#dc2626">~2ⁿ calls — exponential explosion!</text>
  <text x="435" y="342" font-size="11" fill="#64748b">fib(6) makes ~25 recursive calls</text>
  <text x="435" y="362" font-size="11" fill="#64748b">fib(40) makes ~2 billion calls</text>

  <rect x="435" y="375" width="320" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">With memoization: each value computed exactly ONCE → O(n)</text>

  <!-- Legend Box -->
  <rect x="420" y="425" width="350" height="75" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Legend</text>
  <rect x="435" y="455" width="12" height="12" rx="2" fill="#3b82f6"/><text x="455" y="466" font-size="10" fill="#475569">: Computed normally</text>
  <rect x="550" y="455" width="12" height="12" rx="2" fill="#22c55e"/><text x="570" y="466" font-size="10" fill="#475569">: Cache hit — returns instantly</text>
  <rect x="435" y="475" width="12" height="12" rx="2" fill="#94a3b8"/><text x="455" y="486" font-size="10" fill="#475569">: Skipped entirely (pruned subtree)</text>
</svg>