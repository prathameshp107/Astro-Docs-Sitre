<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <linearGradient id="memoGrad" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1d4ed8"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
    <linearGradient id="codeBg" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="800" height="480" fill="url(#bgGrad)" rx="12"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">Top-Down vs Bottom-Up DP — Side by Side</text>

  <!-- LEFT: Memoization -->
  <rect x="20" y="45" width="370" height="380" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="45" width="370" height="32" rx="8" fill="url(#memoGrad)"/>
  <text x="205" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🔵 Memoization (Top-Down)</text>

  <text x="35" y="95" font-size="11" font-weight="bold" fill="#1e293b">How It Works:</text>
  <text x="35" y="113" font-size="10" fill="#475569">1. Start with the original (big) problem</text>
  <text x="35" y="129" font-size="10" fill="#475569">2. Recursively call smaller subproblems</text>
  <text x="35" y="145" font-size="10" fill="#475569">3. Cache results before returning</text>
  <text x="35" y="161" font-size="10" fill="#475569">4. Check cache before recursing</text>

  <!-- Code box -->
  <rect x="30" y="170" width="350" height="130" rx="6" fill="url(#codeBg)" stroke="#334155" stroke-width="1"/>
  <text x="42" y="190" font-size="10" fill="#cbd5e1">function fib(n, memo = {}) {</text>
  <text x="52" y="206" font-size="10" fill="#64748b">  if (n &lt;= 1) return n;</text>
  <text x="52" y="222" font-size="10" fill="#f97316">  if (memo[n] !== undefined)</text>
  <text x="62" y="238" font-size="10" fill="#f97316">❰ return memo[n];  // Cache hit!</text>
  <text x="52" y="254" font-size="10" fill="#22c55e">  memo[n] = fib(n-1, memo) + fib(n-2, memo);</text>
  <text x="52" y="270" font-size="10" fill="#cbd5e1">  return memo[n];</text>
  <text x="42" y="286" font-size="10" fill="#cbd5e1">}</text>
  <text x="42" y="298" font-size="10" fill="#64748b">// fib(40) → only 40 unique calls!</text>

  <!-- Call visualization -->
  <text x="35" y="315" font-size="11" font-weight="bold" fill="#1e293b">Call Tree Structure:</text>
  <text x="35" y="332" font-size="10" fill="#64748b">fib(5) → fib(4) → fib(3) → fib(2) → fib(1) → fib(0)</text>
  <text x="35" y="348" font-size="10" fill="#16a34a">      ← CACHED, ← CACHED, ← each value stored</text>
  <text x="35" y="364" font-size="10" fill="#64748b">Subproblems solved: only needed ones (sparse)</text>

  <!-- Arrow to right -->
  <text x="400" y="245" text-anchor="middle" font-size="22" fill="#64748b">⇄</text>
  <text x="400" y="270" text-anchor="middle" font-size="10" fill="#64748b">Choose based on</text>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#64748b">problem structure</text>

  <!-- RIGHT: Tabulation -->
  <rect x="410" y="45" width="370" height="380" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="410" y="45" width="370" height="32" rx="8" fill="url(#tabGrad)"/>
  <text x="595" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🟢 Tabulation (Bottom-Up)</text>

  <text x="425" y="95" font-size="11" font-weight="bold" fill="#1e293b">How It Works:</text>
  <text x="425" y="113" font-size="10" fill="#475569">1. Initialize a DP table with base cases</text>
  <text x="425" y="129" font-size="10" fill="#475569">2. Fill table from smallest to largest</text>
  <text x="425" y="145" font-size="10" fill="#475569">3. Each cell computed from previous cells</text>
  <text x="425" y="161" font-size="10" fill="#475569">4. Read final answer from last cell</text>

  <!-- Code box -->
  <rect x="420" y="170" width="350" height="130" rx="6" fill="url(#codeBg)" stroke="#334155" stroke-width="1"/>
  <text x="432" y="190" font-size="10" fill="#cbd5e1">function fib(n) {</text>
  <text x="442" y="206" font-size="10" fill="#64748b">  if (n &lt;= 1) return n;</text>
  <text x="442" y="222" font-size="10" fill="#3b82f6">  const dp = new Array(n+1).fill(0);</text>
  <text x="442" y="238" font-size="10" fill="#cbd5e1">  dp[0] = 0; dp[1] = 1;  // base</text>
  <text x="442" y="254" font-size="10" fill="#22c55e">  for (let i = 2; i &lt;= n; i++)</text>
  <text x="452" y="270" font-size="10" fill="#22c55e">❰ dp[i] = dp[i-1] + dp[i-2];</text>
  <text x="442" y="286" font-size="10" fill="#cbd5e1">  return dp[n];</text>
  <text x="420" y="298" font-size="10" fill="#cbd5e1">}</text>

  <!-- Table visualization -->
  <text x="425" y="315" font-size="11" font-weight="bold" fill="#1e293b">DP Table Filling:</text>
  <rect x="425" y="325" width="30" height="22" rx="3" fill="#e2e8f0"/><text x="440" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">0</text>
  <rect x="458" y="325" width="30" height="22" rx="3" fill="#e2e8f0"/><text x="473" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">1</text>
  <rect x="491" y="325" width="30" height="22" rx="3" fill="#3b82f6"/><text x="506" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <rect x="524" y="325" width="30" height="22" rx="3" fill="#3b82f6"/><text x="539" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <rect x="557" y="325" width="30" height="22" rx="3" fill="#3b82f6"/><text x="572" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <rect x="590" y="325" width="30" height="22" rx="3" fill="#3b82f6"/><text x="605" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
  <rect x="623" y="325" width="30" height="22" rx="3" fill="#f97316"/><text x="638" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">8</text>

  <text x="425" y="365" font-size="10" fill="#64748b">Subproblems solved: ALL states from 0 to n</text>

  <!-- Comparison Footer -->
  <rect x="20" y="435" width="760" height="35" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#94a3b8">Memoization: Solves only needed subproblems, risk of stack overflow, easier to reason about</text>
  <text x="400" y="464" text-anchor="middle" font-size="10" fill="#64748b">Tabulation: Solves all subproblems, no recursion, easy to space-optimize with rolling arrays</text>
</svg>