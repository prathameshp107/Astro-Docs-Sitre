<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <linearGradient id="nodeRoot" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#c2410c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
    <linearGradient id="nodeParent" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1d4ed8"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
    <linearGradient id="nodeLeaf" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
    <linearGradient id="nodeExtracted" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#6d28d9"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
    <lineargradient id="nodeChild" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#0f766e"/><stop offset="100%" style="stop-color:#14b8a6"/></lineargradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
    <marker id="arrowEdge" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="800" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Heap Sort — Max-Heap Tree &amp; Extraction</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">Build a max-heap, then repeatedly extract the root (maximum) to build the sorted array</text>

  <!-- === LEFT SIDE: Heap Tree === -->
  <rect x="30" y="70" width="370" height="340" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="215" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Max-Heap Tree of [50, 30, 40, 10, 20, 35]</text>
  <text x="215" y="108" text-anchor="middle" font-size="10" fill="#64748b">Every parent ≥ its children | Root = Maximum</text>

  <!-- Root node (level 0) -->
  <ellipse cx="215" cy="135" rx="28" ry="18" fill="url(#nodeRoot)" filter="url(#shadow)"/>
  <text x="215" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">50</text>

  <!-- Level 0 → Level 1 edges -->
  <line x1="200" y1="152" x2="145" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>
  <line x1="230" y1="152" x2="285" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>

  <!-- Level 1 parents -->
  <ellipse cx="140" cy="195" rx="28" ry="18" fill="url(#nodeParent)" filter="url(#shadow)"/>
  <text x="140" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">30</text>

  <ellipse cx="290" cy="195" rx="28" ry="18" fill="url(#nodeChild)" filter="url(#shadow)"/>
  <text x="290" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">40</text>

  <!-- Level 1 → Level 2 edges -->
  <line x1="125" y1="212" x2="80" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>
  <line x1="155" y1="212" x2="195" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>
  <line x1="275" y1="212" x2="250" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>
  <line x1="305" y1="212" x2="340" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowEdge)"/>

  <!-- Level 2 leaves -->
  <ellipse cx="75" cy="255" rx="28" ry="18" fill="url(#nodeLeaf)"/>
  <text x="75" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">10</text>
  <ellipse cx="200" cy="255" rx="28" ry="18" fill="url(#nodeLeaf)"/>
  <text x="200" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">20</text>
  <ellipse cx="245" cy="255" rx="28" ry="18" fill="url(#nodeLeaf)"/>
  <text x="245" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">35</text>

  <!-- Array representation below tree -->
  <rect x="40" y="300" width="350" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="320" font-size="10" fill="#64748b">Index:</text>
  <text x="95" y="320" font-size="10" font-weight="bold" fill="#1e293b">0</text>
  <text x="145" y="320" font-size="10" font-weight="bold" fill="#1e293b">1</text>
  <text x="195" y="320" font-size="10" font-weight="bold" fill="#1e293b">2</text>
  <text x="245" y="320" font-size="10" font-weight="bold" fill="#1e293b">3</text>
  <text x="295" y="320" font-size="10" font-weight="bold" fill="#1e293b">4</text>
  <text x="345" y="320" font-size="10" font-weight="bold" fill="#1e293b">5</text>

  <rect x="40" y="330" width="350" height="26" rx="4" fill="url(#nodeRoot)" stroke="#f97316" stroke-width="1"/>
  <text x="65" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">50</text>
  <text x="115" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">30</text>
  <text x="165" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">40</text>
  <text x="215" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">10</text>
  <text x="265" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">20</text>
  <text x="315" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">35</text>

  <text x="215" y="375" text-anchor="middle" font-size="10" fill="#64748b">Array representation: left child = 2i+1, right child = 2i+2</text>

  <!-- === RIGHT SIDE: Extraction Process === -->
  <rect x="420" y="70" width="355" height="340" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="597" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Extraction Process</text>
  <text x="597" y="108" text-anchor="middle" font-size="10" fill="#64748b">Swap root with last, heapify, repeat</text>

  <!-- Extraction step 1 -->
  <rect x="435" y="120" width="325" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="445" y="138" font-size="11" font-weight="bold" fill="#dc2626">Extract 1:</text>
  <rect x="510" y="127" width="30" height="20" rx="3" fill="url(#nodeRoot)"/><text x="525" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">50</text>
  <text x="545" y="142" font-size="11" fill="#475569">↔ 35 (last)</text>
  <text x="445" y="158" font-size="10" fill="#64748b">→ Heapify root: new root = 40 → Sorted: [50]</text>

  <!-- Extraction step 2 -->
  <rect x="435" y="178" width="325" height="50" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="445" y="196" font-size="11" font-weight="bold" fill="#ea580c">Extract 2:</text>
  <rect x="510" y="185" width="30" height="20" rx="3" fill="url(#nodeChild)"/><text x="525" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">40</text>
  <text x="545" y="200" font-size="11" fill="#475569">↔ 20 (last unsorted)</text>
  <text x="445" y="216" font-size="10" fill="#64748b">→ Heapify root: new root = 35 → Sorted: [40, 50]</text>

  <!-- Extraction step 3 -->
  <rect x="435" y="236" width="325" height="50" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="445" y="254" font-size="11" font-weight="bold" fill="#16a34a">Extract 3:</text>
  <rect x="510" y="243" width="30" height="20" rx="3" fill="url(#nodeLeaf)"/><text x="525" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">35</text>
  <text x="545" y="258" font-size="11" fill="#475569">↔ 10 (last unsorted)</text>
  <text x="445" y="274" font-size="10" fill="#64748b">→ Heapify root: new root = 30 → Sorted: [35, 40, 50]</text>

  <!-- Extractions continue... -->
  <rect x="435" y="294" width="325" height="50" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="445" y="312" font-size="11" font-weight="bold" fill="#16a34a">Extract 4-6:</text>
  <text x="510" y="312" font-size="11" fill="#475569">Continue extracting root...</text>
  <text x="445" y="332" font-size="10" fill="#64748b">Sorted array built from right to left: [10, 20, 30, 35, 40, 50]</text>

  <!-- Final sorted array -->
  <rect x="435" y="358" width="325" height="35" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="445" y="380" font-size="11" font-weight="bold" fill="#16a34a">✅ Sorted:</text>
  <rect x="500" y="365" width="28" height="18" rx="3" fill="url(#nodeLeaf)"/><text x="514" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">10</text>
  <rect x="532" y="365" width="28" height="18" rx="3" fill="url(#nodeLeaf)"/><text x="546" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">20</text>
  <rect x="564" y="365" width="28" height="18" rx="3" fill="url(#nodeParent)"/><text x="578" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">30</text>
  <rect x="596" y="365" width="28" height="18" rx="3" fill="url(#nodeChild)"/><text x="610" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">35</text>
  <rect x="628" y="365" width="28" height="18" rx="3" fill="url(#nodeParent)"/><text x="642" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">40</text>
  <rect x="660" y="365" width="28" height="18" rx="3" fill="url(#nodeRoot)"/><text x="674" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">50</text>

  <!-- === Properties & Complexity === -->
  <rect x="30" y="425" width="745" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="40" y="448" font-size="13" font-weight="bold" fill="#94a3b8">Complexity &amp; Properties</text>
  
  <rect x="40" y="458" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="130" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#22c55e">Time: O(n log n)</text>
  <text x="130" y="492" text-anchor="middle" font-size="10" fill="#64748b">Guaranteed (all cases)</text>

  <rect x="240" y="458" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="330" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b82f6">Space: O(1)</text>
  <text x="330" y="492" text-anchor="middle" font-size="10" fill="#64748b">In-place sorting</text>

  <rect x="440" y="458" width="160" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">Not Stable</text>
  <text x="520" y="492" text-anchor="middle" font-size="10" fill="#64748b">Equal elements may reorder</text>

  <rect x="620" y="458" width="140" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="690" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#f97316">Build Heap: O(n)</text>
  <text x="690" y="492" text-anchor="middle" font-size="10" fill="#64748b">(not O(n log n)!)</text>

  <!-- Build heap proof -->
  <rect x="30" y="520" width="745" height="45" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="540" font-size="12" font-weight="bold" fill="#1d4ed8">💡 Why is building a heap O(n)?</text>
  <text x="40" y="556" font-size="11" fill="#475569">Most nodes are near the bottom (n/2 leaves) requiring almost no work. Only the root needs O(log n). Total = Σ n/2ʰ⁺¹ × O(h) = O(n)</text>

  <!-- Comparison to Quick Sort -->
  <rect x="30" y="575" width="745" height="32" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="40" y="596" font-size="11" fill="#475569">⚠ Heap Sort vs Quick Sort: Both O(n log n) avg, but Heap Sort is ~2-5× slower in practice due to poor cache locality (random array access)</text>
</svg>
