<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1d4ed8"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
    <linearGradient id="barRed" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#b91c1c"/><stop offset="100%" style="stop-color:#ef4444"/></linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#c2410c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#6d28d9"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="800" height="580" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bubble Sort — Adjacent Swaps Visualization</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#64748b">Each pass "bubbles" the largest unsorted element to its final position</text>

  <!-- Pass labels -->
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#475569">Initial:</text>
  <text x="60" y="180" font-size="12" font-weight="bold" fill="#475569">Pass 1:</text>
  <text x="60" y="280" font-size="12" font-weight="bold" fill="#475569">Pass 2:</text>
  <text x="60" y="380" font-size="12" font-weight="bold" fill="#475569">Pass 3:</text>
  <text x="60" y="480" font-size="12" font-weight="bold" fill="#475569">Done:</text>

  <!-- === ROW 0: Initial array === -->
  <!-- 64 -->
  <rect x="100" y="95" width="40" height="55" rx="4" fill="url(#barBlue)" filter="url(#shadow)"/>
  <text x="120" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">64</text>
  <!-- 34 -->
  <rect x="150" y="105" width="40" height="45" rx="4" fill="url(#barOrange)" filter="url(#shadow)"/>
  <text x="170" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">34</text>
  <!-- 25 -->
  <rect x="200" y="112" width="40" height="38" rx="4" fill="url(#barPurple)" filter="url(#shadow)"/>
  <text x="220" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">25</text>
  <!-- 12 -->
  <rect x="250" y="120" width="40" height="30" rx="4" fill="url(#barGreen)" filter="url(#shadow)"/>
  <text x="270" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">12</text>
  <!-- 22 -->
  <rect x="300" y="117" width="40" height="33" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
  <text x="320" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">22</text>

  <!-- === ROW 1: Pass 1 - Bubbling 64 === -->
  <!-- Two highlighted bars being compared -->
  <rect x="100" y="195" width="40" height="55" rx="4" fill="url(#barBlue)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="120" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">64</text>
  <rect x="150" y="205" width="40" height="45" rx="4" fill="url(#barOrange)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="170" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">34</text>
  <!-- arrow between them -->
  <line x1="143" y1="218" x2="148" y2="218" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="147" y="230" font-size="9" fill="#d97706" text-anchor="middle">swap</text>

  <rect x="200" y="212" width="40" height="38" rx="4" fill="url(#barPurple)" filter="url(#shadow)"/>
  <text x="220" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">25</text>
  <rect x="250" y="220" width="40" height="30" rx="4" fill="url(#barGreen)" filter="url(#shadow)"/>
  <text x="270" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">12</text>
  <rect x="300" y="217" width="40" height="33" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
  <text x="320" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">22</text>

  <!-- Sorted marker -->
  <text x="320" y="260" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>

  <!-- === ROW 2: Pass 2 - Bubbling 34 === -->
  <rect x="100" y="295" width="40" height="38" rx="4" fill="url(#barPurple)" filter="url(#shadow)"/>
  <text x="120" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">25</text>

  <rect x="150" y="305" width="40" height="45" rx="4" fill="url(#barOrange)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="170" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">34</text>
  <rect x="200" y="312" width="40" height="38" rx="4" fill="url(#barPurple)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="220" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">12</text>
  <line x1="192" y1="328" x2="197" y2="328" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="310" width="40" height="42" rx="4" fill="url(#barBlue)" filter="url(#shadow)"/>
  <text x="270" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">22</text>

  <!-- Sorted marker -->
  <text x="270" y="358" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>
  <text x="320" y="358" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>

  <!-- === ROW 3: Pass 3 === -->
  <rect x="100" y="395" width="40" height="33" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
  <text x="120" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">22</text>

  <rect x="150" y="395" width="40" height="42" rx="4" fill="url(#barBlue)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="170" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">25</text>
  <rect x="200" y="400" width="40" height="45" rx="4" fill="url(#barOrange)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3"/>
  <text x="220" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">34</text>

  <!-- Sorted markers -->
  <text x="220" y="458" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>
  <text x="270" y="458" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>
  <text x="320" y="458" text-anchor="middle" font-size="9" fill="#64748b">↑ sorted</text>

  <!-- === ROW 4: Final sorted === -->
  <rect x="100" y="490" width="40" height="30" rx="4" fill="url(#barGreen)" filter="url(#shadow)"/>
  <text x="120" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">12</text>
  <rect x="150" y="493" width="40" height="33" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
  <text x="170" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">22</text>
  <rect x="200" y="488" width="40" height="38" rx="4" fill="url(#barPurple)" filter="url(#shadow)"/>
  <text x="220" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">25</text>
  <rect x="250" y="483" width="40" height="45" rx="4" fill="url(#barOrange)" filter="url(#shadow)"/>
  <text x="270" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">34</text>
  <rect x="300" y="475" width="40" height="55" rx="4" fill="url(#barBlue)" filter="url(#shadow)"/>
  <text x="320" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">64</text>

  <!-- Checkmark -->
  <text x="360" y="520" font-size="28" fill="#16a34a">✅</text>

  <!-- Legend -->
  <rect x="440" y="80" width="330" height="130" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="605" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Legend</text>
  <rect x="455" y="110" width="14" height="14" rx="2" fill="#f97316"/><text x="475" y="122" font-size="11" fill="#475569">: Elements being compared</text>
  <rect x="455" y="130" width="14" height="14" rx="2" fill="#3b82f6"/><text x="475" y="142" font-size="11" fill="#475569">: Unsorted element</text>
  <rect x="455" y="150" width="14" height="14" rx="2" fill="#22c55e"/><text x="475" y="162" font-size="11" fill="#475569">: Sorted in final position</text>
  <text x="455" y="182" font-size="11" fill="#64748b">After each pass, the largest unsorted element</text>
  <text x="455" y="196" font-size="11" fill="#64748b">"bubbles up" to its correct final position</text>

  <!-- Stats -->
  <rect x="440" y="220" width="330" height="80" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="455" y="242" font-size="11" font-weight="bold" fill="#1e293b">Complexity:</text>
  <text x="455" y="260" font-size="11" fill="#475569">Comparisons: n(n-1)/2 = 10</text>
  <text x="455" y="278" font-size="11" fill="#475569">Swaps: up to n(n-1)/2 = 10</text>
  <text x="455" y="296" font-size="11" fill="#475569">Best case (optimized): O(n) if already sorted</text>
</svg>
