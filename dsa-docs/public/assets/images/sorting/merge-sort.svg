<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#1d4ed8"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#15803d"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#c2410c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#6d28d9"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
    <linearGradient id="gradTeal" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#0f766e"/><stop offset="100%" style="stop-color:#14b8a6"/></linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" style="stop-color:#b91c1c"/><stop offset="100%" style="stop-color:#ef4444"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Merge Sort — Divide &amp; Conquer Strategy</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">Split the array into halves, recursively sort each half, then merge the sorted halves back together</text>

  <!-- === Box: The Divide Phase === -->
  <rect x="40" y="65" width="340" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">① Divide Phase (O(log n) levels)</text>
  <text x="210" y="102" text-anchor="middle" font-size="11" fill="#64748b">Split the array into halves until reaching single elements</text>

  <!-- Level 0 (top) -->
  <rect x="100" y="112" width="220" height="24" rx="4" fill="url(#gradBlue)" filter="url(#shadow)"/>
  <text x="210" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[38, 27, 43, 3, 9, 82, 10]</text>

  <line x1="150" y1="136" x2="125" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="136" x2="295" y2="150" stroke="#64748b" stroke-width="1.5"/>

  <!-- Level 1 -->
  <rect x="60" y="152" width="120" height="24" rx="4" fill="url(#gradOrange)" filter="url(#shadow)"/>
  <text x="120" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[38, 27, 43, 3]</text>
  <rect x="240" y="152" width="120" height="24" rx="4" fill="url(#gradPurple)" filter="url(#shadow)"/>
  <text x="300" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[9, 82, 10]</text>

  <line x1="90" y1="176" x2="75" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="150" y1="176" x2="165" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="176" x2="255" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="330" y1="176" x2="345" y2="190" stroke="#64748b" stroke-width="1.5"/>

  <!-- Level 2 -->
  <rect x="50" y="192" width="60" height="24" rx="4" fill="url(#gradGreen)"/>
  <text x="80" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[38, 27]</text>
  <rect x="140" y="192" width="60" height="24" rx="4" fill="url(#gradTeal)"/>
  <text x="170" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[43, 3]</text>
  <rect x="230" y="192" width="60" height="24" rx="4" fill="url(#gradRed)"/>
  <text x="260" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[9, 82]</text>
  <rect x="320" y="192" width="40" height="24" rx="4" fill="url(#gradBlue)"/>
  <text x="340" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[10]</text>

  <!-- === Box: The Conquer (Merge) Phase === -->
  <rect x="420" y="65" width="350" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">② Conquer Phase (O(n) per level)</text>
  <text x="595" y="102" text-anchor="middle" font-size="11" fill="#64748b">Merge sorted subarrays back up, level by level</text>

  <!-- Merging visualization -->
  <rect x="450" y="112" width="290" height="24" rx="4" fill="url(#gradBlue)" filter="url(#shadow)"/>
  <text x="595" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[3, 9, 10, 27, 38, 43, 82]</text>

  <line x1="530" y1="136" x2="530" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="660" y1="136" x2="660" y2="150" stroke="#64748b" stroke-width="1.5"/>

  <rect x="465" y="152" width="130" height="24" rx="4" fill="url(#gradOrange)"/>
  <text x="530" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[3, 27, 38, 43]</text>
  <rect x="595" y="152" width="100" height="24" rx="4" fill="url(#gradPurple)"/>
  <text x="645" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">[9, 10, 82]</text>

  <line x1="500" y1="176" x2="490" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="560" y1="176" x2="570" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="620" y1="176" x2="610" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="670" y1="176" x2="680" y2="190" stroke="#64748b" stroke-width="1.5"/>

  <rect x="460" y="192" width="55" height="24" rx="4" fill="url(#gradGreen)"/>
  <text x="487" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[27, 38]</text>
  <rect x="525" y="192" width="55" height="24" rx="4" fill="url(#gradTeal)"/>
  <text x="552" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[3, 43]</text>
  <rect x="590" y="192" width="55" height="24" rx="4" fill="url(#gradRed)"/>
  <text x="617" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[9, 82]</text>
  <rect x="660" y="192" width="45" height="24" rx="4" fill="url(#gradBlue)"/>
  <text x="682" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">[10]</text>

  <!-- === Merge Detail Section === -->
  <rect x="40" y="230" width="730" height="180" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">③ The Merge Step — How Two Sorted Arrays Are Combined</text>

  <!-- Input arrays -->
  <text x="80" y="278" font-size="11" font-weight="bold" fill="#475569">Two sorted subarrays:</text>
  <rect x="80" y="285" width="140" height="26" rx="4" fill="url(#gradGreen)"/>
  <text x="150" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">[27, 38]</text>
  
  <rect x="240" y="285" width="140" height="26" rx="4" fill="url(#gradTeal)"/>
  <text x="310" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">[3, 43]</text>

  <line x1="150" y1="311" x2="150" y2="320" stroke="#64748b" stroke-width="1.5"/>
  <line x1="310" y1="311" x2="310" y2="320" stroke="#64748b" stroke-width="1.5"/>

  <!-- Compare elements step by step -->
  <text x="80" y="338" font-size="11" font-weight="bold" fill="#475569">Compare &amp; Merge:</text>

  <!-- Step 1-4 merge process -->
  <rect x="80" y="345" width="660" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="100" y="364" font-size="11" fill="#64748b">Step 1:</text>
  <rect x="150" y="352" width="42" height="22" rx="3" fill="url(#gradGreen)" stroke="#f59e0b" stroke-width="2"/><text x="171" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">27</text>
  <text x="178" y="383" text-anchor="middle" font-size="9" fill="#f59e0b">i</text>
  <rect x="198" y="352" width="42" height="22" rx="3" fill="url(#gradTeal)" stroke="#f59e0b" stroke-width="2"/><text x="219" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <text x="219" y="383" text-anchor="middle" font-size="9" fill="#f59e0b">j</text>
  <text x="250" y="368" font-size="11" fill="#1e293b">3 &lt; 27 → take <tspan fill="#16a34a" font-weight="bold">3</tspan> → result = [3]</text>

  <rect x="100" y="390" width="660" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="120" y="406" font-size="11" fill="#64748b">Final merged result: <tspan font-size="12" font-weight="bold" fill="#16a34a">[3, 27, 38, 43]</tspan></text>

  <!-- Properties panel -->
  <rect x="40" y="425" width="730" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="448" font-size="12" font-weight="bold" fill="#94a3b8">Complexity Analysis</text>
  <text x="60" y="468" font-size="11" fill="#94a3b8">• <tspan fill="#22c55e" font-weight="bold">Time: O(n log n)</tspan> — log n levels × n work per level (guaranteed!)</text>
  <text x="60" y="488" font-size="11" fill="#94a3b8">• <tspan fill="#f97316" font-weight="bold">Space: O(n)</tspan> — uses temporary arrays for merging (not in-place)</text>
  <text x="60" y="504" font-size="11" fill="#94a3b8">• <tspan fill="#22c55e" font-weight="bold">Stable: Yes</tspan> — equal elements from left subarray come first during merge</text>

  <!-- Key insight box -->
  <rect x="40" y="518" width="730" height="55" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="405" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">💡 Key Insight: Merge Sort is Guaranteed O(n log n)</text>
  <text x="405" y="558" text-anchor="middle" font-size="11" fill="#475569">Unlike Quick Sort, Merge Sort's time complexity does NOT depend on pivot selection. It always splits at midpoint.</text>
</svg>
