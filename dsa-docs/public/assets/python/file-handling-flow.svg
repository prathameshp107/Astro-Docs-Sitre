<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#2dd4bf" font-size="20" font-family="system-ui,sans-serif" font-weight="700" filter="url(#glow)">File Handling Flow</text>
  <line x1="200" y1="47" x2="600" y2="47" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  
  <!-- Step 1: Open -->
  <rect x="50" y="75" width="160" height="70" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" fill="#2dd4bf" font-size="14" font-family="system-ui,sans-serif" font-weight="600">1. Open File</text>
  <text x="130" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">f = open(\"file.txt\")</text>
  
  <!-- Arrow 1 -->
  <line x1="210" y1="110" x2="260" y2="110" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Read/Write -->
  <rect x="270" y="75" width="160" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="350" y="105" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="system-ui,sans-serif" font-weight="600">2. Read/Write</text>
  <text x="350" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">f.read() / f.write()</text>
  
  <!-- Arrow 2 -->
  <line x1="430" y1="110" x2="480" y2="110" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Close -->
  <rect x="490" y="75" width="160" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="570" y="105" text-anchor="middle" fill="#34d399" font-size="14" font-family="system-ui,sans-serif" font-weight="600">3. Close File</text>
  <text x="570" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">f.close()</text>
  
  <!-- Best Practice section -->
  <rect x="50" y="180" width="620" height="100" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="208" text-anchor="middle" fill="#34d399" font-size="14" font-family="system-ui,sans-serif" font-weight="600">✨ Best Practice: Use Context Manager</text>
  
  <rect x="70" y="220" width="580" height="50" rx="8" fill="#0d9488" opacity="0.2"/>
  <text x="100" y="240" fill="#6ee7b7" font-size="13" font-family="monospace">with open(\"file.txt\", \"r\", encoding=\"utf-8\") as f:</text>
  <text x="120" y="260" fill="#6ee7b7" font-size="13" font-family="monospace">content = f.read()  # Auto-closed!</text>
  
  <!-- Modes table -->
  <rect x="50" y="310" width="700" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="338" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="system-ui,sans-serif" font-weight="600">File Modes</text>
  
  <rect x="70" y="350" width="80" height="25" rx="4" fill="#2dd4bf" opacity="0.2"/>
  <text x="110" y="368" text-anchor="middle" fill="#2dd4bf" font-size="12" font-family="monospace">"r"</text>
  <rect x="160" y="350" width="180" height="25" rx="4" fill="#334155"/>
  <text x="250" y="368" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Read (default)</text>
  
  <rect x="360" y="350" width="80" height="25" rx="4" fill="#38bdf8" opacity="0.2"/>
  <text x="400" y="368" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="monospace">"w"</text>
  <rect x="450" y="350" width="180" height="25" rx="4" fill="#334155"/>
  <text x="540" y="368" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Write (overwrite)</text>
  
  <rect x="70" y="382" width="80" height="25" rx="4" fill="#a78bfa" opacity="0.2"/>
  <text x="110" y="400" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="monospace">"a"</text>
  <rect x="160" y="382" width="180" height="25" rx="4" fill="#334155"/>
  <text x="250" y="400" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Append</text>
  
  <rect x="360" y="382" width="80" height="25" rx="4" fill="#f472b6" opacity="0.2"/>
  <text x="400" y="400" text-anchor="middle" fill="#f472b6" font-size="12" font-family="monospace">"x"</text>
  <rect x="450" y="382" width="180" height="25" rx="4" fill="#334155"/>
  <text x="540" y="400" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Create (fail if exists)</text>
  
  <rect x="70" y="414" width="80" height="25" rx="4" fill="#fbbf24" opacity="0.2"/>
  <text x="110" y="432" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="monospace">"rb"</text>
  <rect x="160" y="414" width="180" height="25" rx="4" fill="#334155"/>
  <text x="250" y="432" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Read binary</text>
</svg>
