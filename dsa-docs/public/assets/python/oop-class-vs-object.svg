<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#2dd4bf" font-size="22" font-family="system-ui,sans-serif" font-weight="700" filter="url(#glow)">Class vs Object</text>
  <line x1="200" y1="52" x2="600" y2="52" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  
  <!-- Class Blueprint -->
  <rect x="60" y="80" width="300" height="200" rx="12" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="60" y="80" width="300" height="40" rx="12" fill="#0d9488" opacity="0.3"/>
  <text x="210" y="105" text-anchor="middle" fill="#2dd4bf" font-size="16" font-family="system-ui,sans-serif" font-weight="700">📋 Class (Blueprint)</text>
  
  <text x="80" y="140" fill="#99f6e4" font-size="13" font-family="monospace" font-weight="600">class Car:</text>
  <text x="80" y="165" fill="#94a3b8" font-size="12" font-family="monospace">    def __init__(self, brand, model):</text>
  <text x="100" y="185" fill="#94a3b8" font-size="12" font-family="monospace">self.brand = brand</text>
  <text x="100" y="205" fill="#94a3b8" font-size="12" font-family="monospace">self.model = model</text>
  <text x="80" y="230" fill="#94a3b8" font-size="12" font-family="monospace">    def start(self):</text>
  <text x="100" y="250" fill="#94a3b8" font-size="12" font-family="monospace">return f\"{self.brand} started\"</text>
  
  <!-- Arrow from Class to Objects -->
  <line x1="360" y1="180" x2="440" y2="180" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="170" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="system-ui,sans-serif">instantiate</text>
  
  <!-- Object 1 -->
  <rect x="460" y="80" width="280" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="460" y="80" width="280" height="35" rx="12" fill="#0284c7" opacity="0.3"/>
  <text x="600" y="103" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="system-ui,sans-serif" font-weight="600">🚗 Object</text>
  
  <text x="480" y="135" fill="#6ee7b7" font-size="13" font-family="monospace">brand  =  \"Toyota\"</text>
  <text x="480" y="160" fill="#6ee7b7" font-size="13" font-family="monospace">model  =  \"Camry\"</text>
  <text x="480" y="185" fill="#64748b" font-size="12" font-family="monospace">Methods: start(), stop()</text>
  
  <!-- Object 2 -->
  <rect x="460" y="220" width="280" height="120" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="460" y="220" width="280" height="35" rx="12" fill="#7c3aed" opacity="0.3"/>
  <text x="600" y="243" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="system-ui,sans-serif" font-weight="600">🚗 Object</text>
  
  <text x="480" y="275" fill="#fda4af" font-size="13" font-family="monospace">brand  =  \"Tesla\"</text>
  <text x="480" y="300" fill="#fda4af" font-size="13" font-family="monospace">model  =  \"Model 3\"</text>
  <text x="480" y="325" fill="#64748b" font-size="12" font-family="monospace">Methods: start(), stop()</text>
  
  <!-- Key Insight Box -->
  <rect x="80" y="370" width="640" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="400" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="system-ui,sans-serif" font-weight="600">💡 Key Insight</text>
  <text x="400" y="425" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif">A class is a blueprint — it defines the structure and behavior.</text>
  <text x="400" y="448" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif">Objects are instances created from the blueprint with their own data.</text>
  <text x="400" y="465" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace">Same class → Different objects → Independent data</text>
</svg>
