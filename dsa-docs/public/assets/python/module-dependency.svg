<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-filled" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  
  <rect width="800" height="480" fill="url(#bg)" rx="12"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#2dd4bf" font-size="20" font-family="system-ui,sans-serif" font-weight="700" filter="url(#glow)">Python Module Dependency Structure</text>
  <line x1="160" y1="47" x2="640" y2="47" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  
  <!-- Main Application -->
  <rect x="300" y="70" width="200" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" fill="#6ee7b7" font-size="14" font-family="system-ui,sans-serif" font-weight="700">app.py (Main)</text>
  
  <!-- Import arrows from main to modules -->
  <line x1="350" y1="120" x2="200" y2="160" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-filled)"/>
  <line x1="400" y1="120" x2="400" y2="160" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-filled)"/>
  <line x1="450" y1="120" x2="600" y2="160" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-filled)"/>
  
  <!-- Top-level modules -->
  <rect x="100" y="165" width="180" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="100" y="165" width="180" height="5" rx="8" fill="#38bdf8"/>
  <text x="190" y="195" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="system-ui,sans-serif" font-weight="600">📦 utils/</text>
  <text x="190" y="218" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">helpers.py, validators.py</text>
  
  <rect x="310" y="165" width="180" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="310" y="165" width="180" height="5" rx="8" fill="#a78bfa"/>
  <text x="400" y="195" text-anchor="middle" fill="#c4b5fd" font-size="13" font-family="system-ui,sans-serif" font-weight="600">📦 models/</text>
  <text x="400" y="218" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">user.py, product.py</text>
  
  <rect x="520" y="165" width="180" height="70" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <rect x="520" y="165" width="180" height="5" rx="8" fill="#f472b6"/>
  <text x="610" y="195" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="system-ui,sans-serif" font-weight="600">📦 services/</text>
  <text x="610" y="218" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">api.py, auth.py</text>
  
  <!-- Sub-dependencies arrows -->
  <line x1="190" y1="235" x2="190" y2="270" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-filled)"/>
  <line x1="130" y1="235" x2="70" y2="270" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-filled)"/>
  <line x1="400" y1="235" x2="400" y2="270" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-filled)"/>
  <line x1="610" y1="235" x2="610" y2="270" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-filled)"/>
  
  <!-- Third-party / Standard Library -->
  <rect x="50" y="275" width="180" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="140" y="305" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="monospace">📚 Standard Library</text>
  
  <rect x="280" y="275" width="240" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="400" y="300" text-anchor="middle" fill="#34d399" font-size="12" font-family="monospace">📦 Third-party Packages</text>
  <text x="400" y="316" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace">flask, requests, numpy</text>
  
  <rect x="560" y="275" width="180" height="50" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="650" y="305" text-anchor="middle" fill="#f87171" font-size="12" font-family="monospace">⚙️ Configuration</text>
  
  <!-- Cross-module dependencies -->
  <path d="M280 200 L305 200" stroke="#475569" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-filled)"/>
  <path d="M490 200 L515 200" stroke="#475569" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrow-filled)"/>
  
  <!-- Summary -->
  <rect x="50" y="360" width="700" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="388" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="system-ui,sans-serif" font-weight="600">📦 Python Module System</text>
  <text x="70" y="412" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">• A <tspan fill="#2dd4bf">module</tspan> = a single .py file containing code</text>
  <text x="70" y="432" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">• A <tspan fill="#2dd4bf">package</tspan> = a directory of modules with __init__.py</text>
  <text x="70" y="452" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">• Use <tspan fill="#2dd4bf">from X import Y</tspan> for selective imports | <tspan fill="#2dd4bf">import X</tspan> for full module</text>
</svg>
