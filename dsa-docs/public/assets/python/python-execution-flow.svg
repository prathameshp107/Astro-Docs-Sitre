<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#2dd4bf" font-size="22" font-family="system-ui,sans-serif" font-weight="700" filter="url(#glow)">Python Code Execution Flow</text>
  <line x1="150" y1="58" x2="650" y2="58" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  
  <!-- Box 1: Source Code -->
  <rect x="300" y="85" width="200" height="65" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" fill="#99f6e4" font-size="15" font-family="system-ui,sans-serif" font-weight="600">🐍 Source Code</text>
  <text x="400" y="137" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">hello.py</text>
  
  <!-- Arrow 1 -->
  <line x1="400" y1="150" x2="400" y2="185" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="172" fill="#38bdf8" font-size="11" font-family="monospace">Compilation</text>
  
  <!-- Box 2: Bytecode -->
  <rect x="280" y="190" width="240" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" fill="#7dd3fc" font-size="15" font-family="system-ui,sans-serif" font-weight="600">⚡ Bytecode</text>
  <text x="400" y="242" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">hello.pyc</text>
  
  <!-- Arrow 2 -->
  <line x1="400" y1="255" x2="400" y2="290" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="277" fill="#38bdf8" font-size="11" font-family="monospace">Interpretation</text>
  
  <!-- Box 3: PVM -->
  <rect x="260" y="295" width="280" height="65" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" fill="#c4b5fd" font-size="15" font-family="system-ui,sans-serif" font-weight="600">🖥️ Python Virtual Machine</text>
  <text x="400" y="347" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">Executes bytecode</text>
  
  <!-- Arrow 3 -->
  <line x1="400" y1="360" x2="400" y2="395" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- Box 4: Output -->
  <rect x="300" y="400" width="200" height="55" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" fill="#6ee7b7" font-size="15" font-family="system-ui,sans-serif" font-weight="600">✅ Program Output</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="monospace">Hello, World!</text>
  
  <!-- Side panel: Details -->
  <rect x="50" y="495" width="700" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="520" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Step 1: Write .py file → Step 2: Compiled to .pyc bytecode</text>
  <text x="400" y="540" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Step 3: PVM interprets bytecode → Step 4: CPU executes</text>
  <text x="400" y="565" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">Python uses a hybrid compiled/interpreted approach</text>
</svg>
