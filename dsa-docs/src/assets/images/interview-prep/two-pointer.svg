<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="750" height="380" fill="url(#bg)" rx="12"/>
  <text x="375" y="35" text-anchor="middle" fill="#ecf0f1" font-size="22" font-weight="bold" font-family="Arial">Two Pointer Technique</text>
  <text x="375" y="55" text-anchor="middle" fill="#bdc3c7" font-size="13" font-family="Arial">Reverse Array: [1, 2, 3, 4, 5, 6]</text>

  <!-- Step labels -->
  <text x="70" y="85" fill="#7f8c8d" font-size="12" font-family="Arial">Step 1:</text>
  <text x="70" y="160" fill="#7f8c8d" font-size="12" font-family="Arial">Step 2:</text>
  <text x="70" y="235" fill="#7f8c8d" font-size="12" font-family="Arial">Step 3:</text>

  <!-- Array boxes - Step 1 -->
  <rect x="130" y="70" width="480" height="40" rx="5" fill="#0a1628" stroke="#34495e" stroke-width="1.5"/>
  <rect x="130" y="70" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="210" y="70" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="290" y="70" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="370" y="70" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="450" y="70" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="530" y="70" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="95" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>
  <text x="250" y="95" text-anchor="middle" fill="#ecf0f1" font-size="16">2</text>
  <text x="330" y="95" text-anchor="middle" fill="#ecf0f1" font-size="16">3</text>
  <text x="410" y="95" text-anchor="middle" fill="#ecf0f1" font-size="16">4</text>
  <text x="490" y="95" text-anchor="middle" fill="#ecf0f1" font-size="16">5</text>
  <text x="570" y="95" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>

  <!-- Pointers Step 1 -->
  <line x1="170" y1="115" x2="170" y2="130" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="170" y="145" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">L</text>
  <line x1="570" y1="115" x2="570" y2="130" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="570" y="145" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="bold">R</text>

  <text x="660" y="92" fill="#f1c40f" font-size="14" font-weight="bold">Swap 1↔6</text>

  <!-- Array boxes - Step 2 -->
  <rect x="130" y="155" width="480" height="40" rx="5" fill="#0a1628" stroke="#34495e" stroke-width="1.5"/>
  <rect x="130" y="155" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="210" y="155" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="290" y="155" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="370" y="155" width="80" height="40" rx="5" fill="#1a5276"/>
  <rect x="450" y="155" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="530" y="155" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="170" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
  <text x="250" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <text x="330" y="180" text-anchor="middle" fill="#ecf0f1" font-size="16">3</text>
  <text x="410" y="180" text-anchor="middle" fill="#ecf0f1" font-size="16">4</text>
  <text x="490" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">5</text>
  <text x="570" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>

  <!-- Pointers Step 2 -->
  <line x1="250" y1="200" x2="250" y2="215" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="250" y="230" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">L</text>
  <line x1="490" y1="200" x2="490" y2="215" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="230" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="bold">R</text>

  <text x="660" y="178" fill="#f1c40f" font-size="14" font-weight="bold">Swap 2↔5</text>

  <!-- Array boxes - Step 3 -->
  <rect x="130" y="240" width="480" height="40" rx="5" fill="#0a1628" stroke="#34495e" stroke-width="1.5"/>
  <rect x="130" y="240" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="210" y="240" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="290" y="240" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="370" y="240" width="80" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <rect x="450" y="240" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="530" y="240" width="80" height="40" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="170" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
  <text x="250" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">5</text>
  <text x="330" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>
  <text x="410" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">4</text>
  <text x="490" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <text x="570" y="265" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>

  <!-- Pointers Step 3 -->
  <line x1="330" y1="285" x2="330" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="330" y="315" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">L</text>
  <line x1="410" y1="285" x2="410" y2="300" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="410" y="315" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="bold">R</text>

  <text x="660" y="263" fill="#f1c40f" font-size="14" font-weight="bold">Swap 3↔4</text>

  <!-- Done indicator -->
  <rect x="220" y="340" width="290" height="25" rx="12" fill="#27ae60" opacity="0.8"/>
  <text x="365" y="357" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="Arial">✅ DONE! L &amp; R crossed → [6, 5, 4, 3, 2, 1]</text>
</svg>