<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#ecf0f1" font-size="22" font-weight="bold" font-family="Arial">Types of Recursion</text>

  <!-- Direct Recursion -->
  <rect x="20" y="55" width="370" height="110" rx="8" fill="#0a1628" stroke="#0f3460" stroke-width="1.5"/>
  <text x="205" y="78" text-anchor="middle" fill="#3498db" font-size="15" font-weight="bold" font-family="Arial">1. Direct Recursion</text>
  <text x="205" y="98" text-anchor="middle" fill="#bdc3c7" font-size="12" font-family="'Courier New', monospace">function A(n) → A(n-1) → A(n-2) → ...</text>
  <text x="205" y="118" text-anchor="middle" fill="#7f8c8d" font-size="11" font-family="Arial">Function calls itself directly</text>
  <text x="130" y="145" fill="#95a5a6" font-size="18" font-family="Arial">A → A → A → A</text>
  <line x1="168" y1="140" x2="250" y2="140" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="252" y1="140" x2="310" y2="140" stroke="#3498db" stroke-width="2"/>

  <!-- Indirect Recursion -->
  <rect x="410" y="55" width="370" height="110" rx="8" fill="#0a1628" stroke="#0f3460" stroke-width="1.5"/>
  <text x="595" y="78" text-anchor="middle" fill="#9b59b6" font-size="15" font-weight="bold" font-family="Arial">2. Indirect Recursion</text>
  <text x="595" y="98" text-anchor="middle" fill="#bdc3c7" font-size="12" font-family="'Courier New', monospace">A(n) → B(n-1) → A(n-2) → ...</text>
  <text x="595" y="118" text-anchor="middle" fill="#7f8c8d" font-size="11" font-family="Arial">Cycle of function calls (A→B→A)</text>
  <text x="515" y="145" fill="#e74c3c" font-size="18" font-family="Arial">A</text>
  <text x="560" y="145" fill="#bdc3c7" font-size="18" font-family="Arial">→</text>
  <text x="585" y="145" fill="#3498db" font-size="18" font-family="Arial">B</text>
  <text x="630" y="145" fill="#bdc3c7" font-size="18" font-family="Arial">→</text>
  <text x="655" y="145" fill="#e74c3c" font-size="18" font-family="Arial">A</text>
  <text x="690" y="145" fill="#bdc3c7" font-size="18" font-family="Arial">→ ...</text>

  <!-- Tail Recursion -->
  <rect x="20" y="180" width="370" height="110" rx="8" fill="#0a1628" stroke="#0f3460" stroke-width="1.5"/>
  <text x="205" y="203" text-anchor="middle" fill="#2ecc71" font-size="15" font-weight="bold" font-family="Arial">3. Tail Recursion</text>
  <text x="205" y="223" text-anchor="middle" fill="#bdc3c7" font-size="12" font-family="'Courier New', monospace">return f(n-1, acc)  ← LAST operation</text>
  <text x="205" y="243" text-anchor="middle" fill="#7f8c8d" font-size="11" font-family="Arial">Recursive call is the final step (nothing after)</text>
  <text x="60" y="272" fill="#e8daef" font-size="11" font-family="'Courier New', monospace">function tailFact(n, acc=1) {</text>
  <text x="80" y="287" fill="#27ae60" font-size="11" font-family="'Courier New', monospace">return tailFact(n-1, n*acc); // ← LAST</text>
  <text x="60" y="302" fill="#e8daef" font-size="11" font-family="'Courier New', monospace">}</text>

  <!-- Head Recursion -->
  <rect x="410" y="180" width="370" height="110" rx="8" fill="#0a1628" stroke="#0f3460" stroke-width="1.5"/>
  <text x="595" y="203" text-anchor="middle" fill="#e67e22" font-size="15" font-weight="bold" font-family="Arial">4. Head Recursion</text>
  <text x="595" y="223" text-anchor="middle" fill="#bdc3c7" font-size="12" font-family="'Courier New', monospace">f(n-1); process(n); ← FIRST call</text>
  <text x="595" y="243" text-anchor="middle" fill="#7f8c8d" font-size="11" font-family="Arial">Processing happens AFTER recursive call returns</text>
  <text x="450" y="272" fill="#e8daef" font-size="11" font-family="'Courier New', monospace">function headRec(n) {</text>
  <text x="470" y="287" fill="#e67e22" font-size="11" font-family="'Courier New', monospace">headRec(n-1);  // ← FIRST</text>
  <text x="470" y="302" fill="#95a5a6" font-size="11" font-family="'Courier New', monospace">console.log(n); // ← AFTER</text>
  <text x="450" y="317" fill="#e8daef" font-size="11" font-family="'Courier New', monospace">}</text>

  <!-- Tree Recursion -->
  <rect x="20" y="308" width="760" height="110" rx="8" fill="#0a1628" stroke="#0f3460" stroke-width="1.5"/>
  <text x="400" y="331" text-anchor="middle" fill="#e74c3c" font-size="15" font-weight="bold" font-family="Arial">5. Tree Recursion</text>
  <text x="400" y="351" text-anchor="middle" fill="#bdc3c7" font-size="12" font-family="'Courier New', monospace">return f(n-1) + f(n-2)  ← TWO recursive calls</text>
  <text x="400" y="371" text-anchor="middle" fill="#7f8c8d" font-size="11" font-family="Arial">Multiple recursive calls per invocation → creates a tree-like call pattern</text>

  <text x="160" y="400" fill="#e74c3c" font-size="14" font-family="Arial">f(5)</text>
  <text x="210" y="400" fill="#bdc3c7" font-size="14" font-family="Arial">/</text>
  <text x="230" y="390" fill="#e74c3c" font-size="12" font-family="Arial">\</text>
  <text x="260" y="400" fill="#0f3460" font-size="14" font-family="Arial">f(4)</text>
  <text x="300" y="400" fill="#bdc3c7" font-size="14" font-family="Arial">+</text>
  <text x="320" y="400" fill="#0f3460" font-size="14" font-family="Arial">f(3)</text>
  <text x="370" y="400" fill="#bdc3c7" font-size="14" font-family="Arial">/</text>
  <text x="390" y="390" fill="#bdc3c7" font-size="12" font-family="Arial">\</text>
  <text x="420" y="400" fill="#7f8c8d" font-size="14" font-family="Arial">f(3)</text>
  <text x="460" y="400" fill="#bdc3c7" font-size="14" font-family="Arial">+</text>
  <text x="480" y="400" fill="#7f8c8d" font-size="14" font-family="Arial">f(2)</text>
  <text x="530" y="400" fill="#bdc3c7" font-size="14" font-family="Arial">...</text>

  <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
  </marker>
</svg>