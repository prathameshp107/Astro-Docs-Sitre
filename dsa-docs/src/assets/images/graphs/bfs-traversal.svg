<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/></marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">BFS — Level-by-Level Traversal (Queue)</text>

  <!-- Graph tree -->
  <circle cx="400" cy="70" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">1</text>

  <circle cx="280" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="280" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">2</text>
  <circle cx="520" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="520" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">3</text>

  <circle cx="180" cy="220" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">4</text>
  <circle cx="350" cy="220" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">5</text>
  <circle cx="520" cy="220" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="520" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">6</text>

  <!-- Edges -->
  <line x1="390" y1="86" x2="296" y2="126" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="410" y1="86" x2="504" y2="126" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="270" y1="156" x2="194" y2="206" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="290" y1="156" x2="340" y2="206" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="520" y1="160" x2="520" y2="200" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Level indicators -->
  <rect x="40" y="55" width="95" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="87" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Level 0: [1]</text>

  <rect x="40" y="125" width="105" height="28" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="92" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Level 1: [2, 3]</text>

  <rect x="40" y="205" width="115" height="28" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="97" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Level 2: [4, 5, 6]</text>

  <!-- Queue visualization -->
  <rect x="30" y="270" width="740" height="135" fill="white" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="400" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Queue State (FIFO)</text>

  <!-- Step 1 -->
  <rect x="50" y="305" width="155" height="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="127" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Step 1</text>
  <rect x="62" y="335" width="55" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="89" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="110" y="380" font-size="9" fill="#64748b">Visit node 1</text>

  <text x="215" y="345" font-size="16" fill="#94a3b8">→</text>

  <!-- Step 2 -->
  <rect x="230" y="305" width="155" height="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="307" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Step 2</text>
  <rect x="242" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="256" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">2</text>
  <rect x="275" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="289" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">3</text>
  <text x="290" y="380" font-size="9" fill="#64748b">Dequeue 1, add 2,3</text>

  <text x="395" y="345" font-size="16" fill="#94a3b8">→</text>

  <!-- Step 3 -->
  <rect x="410" y="305" width="155" height="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="487" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Step 3</text>
  <rect x="422" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="436" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">3</text>
  <rect x="455" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="469" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">4</text>
  <rect x="488" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="502" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">5</text>
  <text x="470" y="380" font-size="9" fill="#64748b">Dequeue 2, add 4,5</text>

  <text x="575" y="345" font-size="16" fill="#94a3b8">→</text>

  <!-- Step 4 -->
  <rect x="590" y="305" width="155" height="85" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="667" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Step 4</text>
  <rect x="602" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="616" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">4</text>
  <rect x="635" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="649" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">5</text>
  <rect x="668" y="335" width="28" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="682" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">6</text>
  <text x="650" y="380" font-size="9" fill="#64748b">Dequeue 3, add 6</text>

  <text x="400" y="405" text-anchor="middle" font-size="10" fill="#64748b">Visit Order: 1 → 2 → 3 → 4 → 5 → 6</text>
</svg>
